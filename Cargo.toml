[workspace]
resolver = "2"
members = [
    "crates/avc-cli",
    "crates/avc-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
md-5 = "0.10"
sha2 = "0.10"
thiserror = "2"
toml = "1.1"
ureq = { version = "~3.2", default-features = false, features = [
    "rustls",
    # Lets a machine's own trust store be used instead of the built-in Mozilla
    # roots, which is what a TLS-intercepting corporate proxy needs.
    "platform-verifier",
] }
url = "2"
